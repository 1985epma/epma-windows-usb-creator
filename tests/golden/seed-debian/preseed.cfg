# EPMA hardening seed for the Debian installer (preseed). Read README.txt first.
# Debian's installer does not find this drive by itself: see README.txt.
# Only non-disk, language-neutral settings are here; disk, accounts and the rest are asked.
d-i pkgsel/include string ufw auditd unattended-upgrades
d-i pkgsel/update-policy select unattended-upgrades
# The script is carried as base64 text and rebuilt inside the new system. Any failure
# is logged and ignored, so the installation always finishes.
d-i preseed/late_command string \
    mkdir -p /target/root; \
    : > /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    echo  >> /target/root/harden-linux.b64; \
    in-target /bin/sh -c 'base64 -d /root/harden-linux.b64 > /root/harden-linux.sh && chmod 700 /root/harden-linux.sh && rm -f /root/harden-linux.b64 && /bin/bash /root/harden-linux.sh --yes --chroot && echo EPMA-hardening-finished >> /var/log/epma-hardening.log || echo EPMA-hardening-failed-installation-goes-on >> /var/log/epma-hardening.log'; \
    true
