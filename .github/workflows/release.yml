# =============================================================================
# CD — Entrega Contínua (publicação de versões)
#
# O QUE É "CD" NUM PROGRAMA DE DESKTOP?
# -------------------------------------
# Em um site, "implantar" significa colocar o código no servidor. Seu projeto
# não tem servidor: ele é um arquivo que a pessoa baixa e executa.
#
# Então aqui "entregar" significa: publicar uma versão oficial, com uma
# IMPRESSÃO DIGITAL que permita a qualquer pessoa conferir que o arquivo
# baixado é exatamente o que você publicou — e não uma cópia adulterada.
#
# Isso ataca diretamente o risco residual RR-02 da auditoria ("o programa não
# tem assinatura digital; uma versão adulterada pediria a senha de
# administrador normalmente").
#
# O QUE CADA VERSÃO RECEBE
#   * os programas já compilados    Linux (x86_64), macOS (Apple silicon) e Windows 11 (x86_64)
#   * SHA256SUMS.txt                impressão digital de cada arquivo
#   * comprovante de origem         attestation SLSA emitida pelo GitHub
#   * sbom.cdx.json                 lista de componentes (CycloneDX 1.5: as bibliotecas Rust
#                                   do Cargo.lock e as ferramentas do sistema), também
#                                   assinada como attestation
#   * notas da versão               a seção correspondente do CHANGELOG.md
#   * atualização do Homebrew       PR automático no tap (homebrew-tap.yml)
#
# COMO PUBLICAR UMA VERSÃO
# ------------------------
#   1. No CHANGELOG.md, renomeie o título "## [1.2.0] - unreleased" com a data
#      (o título precisa conter [X.Y.Z], igual à tag sem o "v").
#   2. git tag v1.2.0
#      git push origin v1.2.0
#
# O resto acontece sozinho.
# =============================================================================

name: Publicar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar (ex.: v1.1.0)'
        required: true

permissions:
  contents: read

# Uma publicação por vez; nunca cancela uma em andamento (ela pode estar no meio
# da criação da Release).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Nenhuma versão sai sem passar por TODAS as conferências
  # ---------------------------------------------------------------------------
  conferencias:
    name: Conferências obrigatórias
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar o Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Instalar as bibliotecas gráficas e as ferramentas de disco
        # As ferramentas de disco são as mesmas que o programa usa no Linux
        # (os testes que exercitam os scripts reais precisam delas).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev \
            parted dosfstools rsync wimtools xorriso util-linux shellcheck

      - name: Formatação e clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Testes
        run: |
          cargo test --no-default-features --locked
          cargo test --locked

      - name: Dependências de terceiros (cargo-audit)
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # ---------------------------------------------------------------------------
  # 2. Compilar o programa em cada sistema
  # ---------------------------------------------------------------------------
  compilar:
    name: Compilar (${{ matrix.alvo }})
    needs: conferencias
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            alvo: x86_64-unknown-linux-gnu
            extensao: ''
            formato: tar.gz
          - os: macos-latest
            alvo: aarch64-apple-darwin
            extensao: ''
            formato: tar.gz
          - os: windows-latest
            alvo: x86_64-pc-windows-msvc
            extensao: .exe
            formato: zip
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar o Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.alvo }}
          rustup default stable

      - name: Instalar as bibliotecas gráficas (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Compilar
        # --locked: exatamente as versões do Cargo.lock.
        run: cargo build --release --locked --target ${{ matrix.alvo }}

      - name: Empacotar
        shell: bash
        env:
          ALVO: ${{ matrix.alvo }}
          EXT: ${{ matrix.extensao }}
          FORMATO: ${{ matrix.formato }}
        run: |
          # Um diretório por alvo, com o programa e a licença. A versão vai no nome do
          # arquivo final (job "publicar"). O nome do programa dentro dele não muda.
          dir="epma-usb-creator-$ALVO"
          mkdir -p "stage/$dir" pacote
          cp "target/$ALVO/release/epma-usb-creator$EXT" "stage/$dir/"
          cp LICENSE README.md "stage/$dir/"
          cd stage
          if [ "$FORMATO" = "zip" ]; then
            7z a "../pacote/$dir.zip" "$dir" > /dev/null
          else
            tar -czf "../pacote/$dir.tar.gz" "$dir"
          fi
          ls -l ../pacote

      - name: Guardar o pacote
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacote-${{ matrix.alvo }}
          path: pacote/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Publicar a versão com impressão digital, SBOM e comprovante de origem
  # ---------------------------------------------------------------------------
  publicar:
    name: Publicar no GitHub
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      versao: ${{ steps.versao.outputs.valor }}
      prerelease: ${{ steps.versao.outputs.prerelease }}
    permissions:
      contents: write        # criar a Release
      id-token: write        # gerar o comprovante de origem (provenance)
      attestations: write    # anexar o comprovante à versão
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determinar a versão
        id: versao
        # O valor digitado em "Run workflow" passa por uma variável de ambiente
        # (nunca colado no texto do script) e é validado antes de ser usado.
        env:
          EVENTO: ${{ github.event_name }}
          VERSAO_INFORMADA: ${{ inputs.versao }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            V="$VERSAO_INFORMADA"
          else
            V="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Versão inválida: '$V'. Use o formato vX.Y.Z (ex.: v1.1.0 ou v1.2.0-rc.1)."
            exit 1
          fi
          case "$V" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "valor=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Publicando versão: $V (pré-lançamento: $PRE)"

      - name: Conferir que a versão da tag é a do Cargo.toml
        env:
          VERSAO: ${{ steps.versao.outputs.valor }}
        run: |
          CARGO_V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$CARGO_V" != "$VERSAO" ]; then
            echo "::error::A tag é $VERSAO, mas o Cargo.toml diz $CARGO_V."
            exit 1
          fi

      - name: Baixar os programas compilados
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pacote-*
          path: compilados
          merge-multiple: true

      - name: Montar o pacote da versão
        env:
          VERSAO: ${{ steps.versao.outputs.valor }}
        run: |
          mkdir -p pacote
          # epma-usb-creator-<alvo>.tar.gz -> epma-usb-creator-<versão>-<alvo>.tar.gz
          for f in compilados/epma-usb-creator-*; do
            nome=$(basename "$f")
            novo="epma-usb-creator-${VERSAO}-${nome#epma-usb-creator-}"
            cp "$f" "pacote/$novo"
          done
          cp README.md README.pt-BR.md SECURITY.md LICENSE CHANGELOG.md Cargo.lock pacote/
          mkdir -p pacote/relatorios
          cp output/*.md pacote/relatorios/
          ls -l pacote

      - name: Gerar o SBOM (CycloneDX 1.5)
        # Lista as bibliotecas Rust do Cargo.lock e as ferramentas do sistema
        # que o programa executa (rsync, wimlib, parted, dosfstools, util-linux...).
        env:
          VERSAO: ${{ steps.versao.outputs.valor }}
        run: |
          python3 .github/scripts/make_sbom.py \
            --version "$VERSAO" \
            --out pacote/sbom.cdx.json \
            --commit "$GITHUB_SHA"

      - name: Calcular as impressões digitais
        run: |
          cd pacote
          # A impressão digital de cada arquivo: permite conferir que nada foi
          # alterado entre a publicação e o download.
          sha256sum epma-usb-creator-v* > SHA256SUMS.txt
          sha256sum sbom.cdx.json Cargo.lock README.md SECURITY.md LICENSE CHANGELOG.md >> SHA256SUMS.txt
          echo "--- Conteúdo de SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Gerar comprovante de origem (provenance)
        # Prova criptográfica, emitida pelo próprio GitHub, de que estes
        # arquivos foram gerados por ESTA esteira, a partir DESTE código — e não
        # montados na máquina de alguém. É o mais próximo de assinatura digital
        # que dá para obter sem comprar um certificado (risco residual RR-02).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pacote/epma-usb-creator-v*
            pacote/sbom.cdx.json
            pacote/SHA256SUMS.txt

      - name: Criar a Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.valor }}
          PRE: ${{ steps.versao.outputs.prerelease }}
        run: |
          # O que mudou: a seção do CHANGELOG.md desta versão, se existir.
          if python3 .github/scripts/changelog_section.py "$VERSAO" > mudancas.md; then
            { echo "## EPMA USB Creator — $VERSAO"; echo; echo "### O que mudou"; echo; cat mudancas.md; echo; } > notas.md
          else
            echo "::notice::CHANGELOG.md não tem a seção [${VERSAO#v}]; usando notas genéricas."
            { echo "## EPMA USB Creator — $VERSAO"; echo; } > notas.md
          fi

          cat >> notas.md <<EOF
          ### Como conferir que o arquivo é autêntico

          Antes de executar, confira a impressão digital do arquivo baixado com o
          \`SHA256SUMS.txt\` desta versão:

          \`\`\`bash
          shasum -a 256 -c SHA256SUMS.txt --ignore-missing
          \`\`\`

          Cada linha do seu arquivo deve imprimir \`OK\`. Se alguma falhar, **não execute o
          programa** — ele foi alterado. Isso importa porque o programa pede sua senha
          de administrador.

          Você também pode verificar o comprovante de origem emitido pelo GitHub:

          \`\`\`bash
          gh attestation verify <arquivo baixado> --repo $GITHUB_REPOSITORY
          \`\`\`

          ### Lista de componentes (SBOM)

          \`sbom.cdx.json\` (CycloneDX 1.5) descreve as bibliotecas Rust de que o programa
          é feito (versões e somas de verificação do \`Cargo.lock\`) e as ferramentas do
          sistema que ele executa. Ele também está assinado como attestation.

          ### Segurança

          Esta versão passou por todas as conferências obrigatórias da esteira de
          publicação: formatação, clippy sem avisos, testes unitários e de integração
          (inclusive os que executam os scripts de shell de verdade) e o cargo-audit das
          dependências. A esteira de segurança roda a cada alteração e toda semana.

          Documentação: \`SECURITY.md\` · Relatórios completos: pasta \`relatorios/\`
          EOF

          FLAGS=()
          if [ "$PRE" = "true" ]; then FLAGS+=(--prerelease); fi

          gh release create "$VERSAO" \
            --title "EPMA USB CREATOR $VERSAO" \
            --notes-file notas.md \
            "${FLAGS[@]}" \
            pacote/epma-usb-creator-v* \
            pacote/SHA256SUMS.txt \
            pacote/SECURITY.md \
            pacote/sbom.cdx.json

  # ---------------------------------------------------------------------------
  # 4. Atualizar o Homebrew (só versões estáveis)
  # ---------------------------------------------------------------------------
  # Abre um PR no tap 1985epma/homebrew-tap. Se o segredo TAP_GITHUB_TOKEN não
  # existir, o job termina com um aviso claro e a publicação NÃO é afetada.
  # (Um workflow disparado pelo evento "release" não funcionaria aqui: eventos
  # criados com o GITHUB_TOKEN não iniciam outros workflows.)
  homebrew:
    name: Atualizar o tap do Homebrew
    needs: publicar
    if: needs.publicar.outputs.prerelease != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ needs.publicar.outputs.versao }}
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
