# =============================================================================
# CI — Integração Contínua
#
# O QUE É ISTO, EM LINGUAGEM SIMPLES
# ----------------------------------
# Toda vez que alguém altera o código, o GitHub roda esta lista de conferências
# automaticamente, numa máquina limpa. Se alguma falhar, a alteração fica
# marcada com um X vermelho e não deve ser aceita.
#
# É o equivalente a um revisor que nunca esquece de conferir nada e trabalha
# 24 horas por dia.
#
# As conferências de SEGURANÇA ficam num arquivo separado: security.yml
#
# CONFERÊNCIAS DESTE ARQUIVO
#   qualidade      formatação (rustfmt) e erros (clippy, sem avisos permitidos)
#   testes         testes unitários e de integração + compilação da versão
#                  final (com a janela), em Linux, macOS e Windows
#   shellcheck     os scripts de shell que o programa roda como ROOT
#   ci-aprovada    resultado consolidado (é este que a proteção de branch exige)
#
# O programa é escrito em Rust. O Windows é verificado AQUI, numa máquina
# Windows de verdade: é a única conferência que compila o código específico
# do Windows (discos brutos, elevação), que não pode ser compilado em outro
# sistema.
#
# AÇÕES DE TERCEIROS são fixadas pelo SHA completo do commit (o comentário
# "# vX.Y.Z" diz a versão). Uma tag pode ser movida por quem controla a ação;
# um SHA não. O Dependabot propõe as atualizações (.github/dependabot.yml).
# O Rust vem pré-instalado nas imagens do GitHub (rustup): nenhuma ação de
# terceiros é usada para instalá-lo.
#
# IMAGENS: "ubuntu-24.04" fixa a versão do sistema. "ubuntu-latest" migra
# sozinho para o Ubuntu 26.04 a partir de 2026-10-19, o que poderia quebrar a
# esteira sem nenhuma alteração no código.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # permite disparar manualmente pelo site do GitHub

# Princípio do menor privilégio: esta esteira só precisa LER o repositório.
# Se um passo for comprometido, ele não consegue escrever nada.
permissions:
  contents: read

# Se você enviar duas alterações seguidas, cancela a execução antiga —
# economiza tempo e recursos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Bibliotecas de sistema que a janela (egui + diálogos de arquivo) precisa no Linux.
  LINUX_GUI_LIBS: >-
    pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev
    libxrandr-dev libxi-dev libgl1-mesa-dev

jobs:
  # ---------------------------------------------------------------------------
  # 1. Formatação e erros de código
  # ---------------------------------------------------------------------------
  qualidade:
    name: Formatação e erros (rustfmt, clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar o Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Instalar as bibliotecas gráficas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $LINUX_GUI_LIBS

      - name: Conferir a formatação
        run: cargo fmt --all -- --check

      - name: Clippy (motor e linha de comando)
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings

      - name: Clippy (com a janela)
        run: cargo clippy --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # 2. Testes: unitários e de integração, em três sistemas
  # ---------------------------------------------------------------------------
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Combinações marcadas como experimentais mostram problemas cedo, mas
    # NÃO barram a alteração.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false        # não interrompe as outras combinações na 1ª falha
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        include:
          # Ubuntu 26.04 é o próximo "ubuntu-latest": descobrir problemas agora.
          - os: ubuntu-26.04
            experimental: true
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar o Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Instalar as bibliotecas gráficas e o ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $LINUX_GUI_LIBS shellcheck

      - name: Testes (motor e linha de comando)
        # Nenhum teste toca em disco, formata nada, usa a rede ou exige
        # privilégio de administrador.
        run: cargo test --no-default-features --locked

      - name: Testes com a janela (lógica da interface)
        run: cargo test --locked

      - name: Compilar a versão final
        run: cargo build --release --locked

      - name: Teste de fumaça da linha de comando
        shell: bash
        run: |
          bin=target/release/epma-usb-creator
          [ "$RUNNER_OS" = "Windows" ] && bin=target/release/epma-usb-creator.exe
          "$bin" --help
          "$bin" detect --help
          "$bin" list --help

  # ---------------------------------------------------------------------------
  # 3. ShellCheck: os scripts de shell que o programa roda como ROOT
  # ---------------------------------------------------------------------------
  # O programa executa trechos de shell com privilégio de administrador
  # (sudo bash -c ...). Eles vivem dentro do código Rust (em arquivos de
  # assets/ ou em textos literais), onde nenhum verificador de shell enxerga.
  # O extrator os tira de lá e o ShellCheck os analisa. Só falha com achados de
  # gravidade "warning" ou maior.
  shellcheck:
    name: Scripts de shell (ShellCheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extrair os scripts embutidos no programa
        # Falha se encontrar menos de 5 scripts: significaria que o extrator
        # parou de reconhecer o código, e a análise passaria "em branco".
        run: python3 .github/scripts/extract_shell.py "$RUNNER_TEMP/shell" | tee "$RUNNER_TEMP/shell-list.txt"

      - name: ShellCheck nos scripts extraídos
        run: |
          shellcheck --version
          shellcheck --shell=bash --severity=warning --format=gcc "$RUNNER_TEMP"/shell/*.sh

      - name: ShellCheck nos scripts do repositório
        run: shellcheck --shell=bash --severity=warning Formula/update-formula.sh assets/*.sh

  # ---------------------------------------------------------------------------
  # 4. Resultado final consolidado
  # ---------------------------------------------------------------------------
  # Este job existe para que a proteção de branch do GitHub precise exigir
  # apenas UMA conferência obrigatória em vez de listar todas as combinações
  # da matriz uma a uma.
  ci-aprovada:
    name: CI aprovada
    if: always()
    needs: [qualidade, testes, shellcheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      R_QUALIDADE: ${{ needs.qualidade.result }}
      R_TESTES: ${{ needs.testes.result }}
      R_SHELLCHECK: ${{ needs.shellcheck.result }}
    steps:
      - name: Verificar o resultado das etapas anteriores
        run: |
          echo "qualidade:  $R_QUALIDADE"
          echo "testes:     $R_TESTES"
          echo "shellcheck: $R_SHELLCHECK"
          falhou=0
          for r in "$R_QUALIDADE" "$R_TESTES" "$R_SHELLCHECK"; do
            [ "$r" = "success" ] || falhou=1
          done
          if [ "$falhou" -ne 0 ]; then
            echo "::error::A CI falhou. Veja os detalhes nas etapas acima."
            exit 1
          fi
          echo "Todas as conferências de CI passaram."
