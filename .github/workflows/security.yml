# =============================================================================
# PIPELINE DE SEGURANÇA
#
# O QUE É ISTO, EM LINGUAGEM SIMPLES
# ----------------------------------
# A auditoria de segurança corrigiu 17 problemas. Nada impede que uma alteração
# futura desfaça uma dessas correções sem ninguém perceber, nem que uma
# biblioteca de terceiros ganhe uma falha conhecida depois de ter sido adotada.
#
# Esta esteira é a vigilância permanente: ela repete as análises
# automaticamente a cada alteração e uma vez por semana, e barra a alteração se
# algo estiver errado.
#
# COMO ELA ESTÁ ORGANIZADA
# ------------------------
# CAMADA 1 — Dependências e regras do compilador (BLOQUEIA a alteração).
#   * cargo-audit: confere o Cargo.lock contra o banco de avisos de segurança do
#     RustSec. Uma biblioteca com falha conhecida barra a alteração.
#   * clippy com os avisos "de rascunho" do projeto (todo!, unimplemented!, dbg!) como
#     ERRO: um stub esquecido num caminho que escreve em disco não pode chegar à versão final.
#
# CAMADA 2 — Ferramentas externas (CodeQL, Gitleaks).
#   Segunda opinião, que encontra coisas que ninguém previu. Barram apenas
#   falhas de gravidade ALTA, para não travar o projeto com alarme falso.
#
# As proteções de segurança do próprio programa (nome de dispositivo validado antes
# de chegar a um comando, senha só por stdin, script que falhou nunca repetido,
# verificação antes de ejetar...) são conferidas pelos TESTES (job "testes" do ci.yml).
#
# Essa divisão é proposital: se um serviço externo sair do ar ou mudar de licença, a
# vigilância essencial continua funcionando.
# =============================================================================

name: Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira às 6h (UTC). Uma falha nova pode ser descoberta no
    # mundo depois que o código foi escrito — por isso a varredura periódica.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # CAMADA 1 — Dependências de terceiros (BLOQUEIA a alteração)
  # ===========================================================================
  dependencias:
    name: 'Camada 1: dependências (cargo-audit)'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar o Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Instalar o cargo-audit
        run: cargo install cargo-audit --locked

      - name: Conferir o Cargo.lock contra o banco de avisos do RustSec
        # Falha com qualquer VULNERABILIDADE conhecida. Avisos de crates sem
        # manutenção ("unmaintained") aparecem no log, mas não barram.
        run: cargo audit

  # ===========================================================================
  # CAMADA 1 — Clippy com as regras de segurança do projeto (BLOQUEIA)
  # ===========================================================================
  clippy-seguranca:
    name: 'Camada 1: clippy (regras de segurança)'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar o Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Clippy sem todo!/unimplemented!/dbg! no código de produção
        # --lib --bins: só o código do programa. Os `unwrap` que restam compilam
        # expressões regulares fixas (verificadas pelos testes), nunca dados externos.
        run: |
          cargo clippy --no-default-features --lib --bins --locked -- \
            -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro

  # ===========================================================================
  # CAMADA 2 — CodeQL: o analisador de segurança do próprio GitHub
  # ===========================================================================
  codeql:
    name: 'Camada 2: CodeQL (SAST)'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # necessário para publicar os alertas na aba Security
      actions: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar as bibliotecas gráficas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Preparar o CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: rust
          queries: security-extended

      - name: Analisar
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:rust'

  # ===========================================================================
  # CAMADA 2 — Segredos: senhas e chaves acidentalmente publicadas
  # ===========================================================================
  segredos:
    name: 'Camada 2: varredura de segredos'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código com todo o histórico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 traz TODOS os commits: um segredo apagado depois
          # continua no histórico e continua vazado.
          fetch-depth: 0

      - name: Varrer o histórico com Gitleaks
        # Não bloqueia por si só: o GitHub tem varredura nativa de segredos
        # (ative em Settings > Code security). Este passo cobre o HISTÓRICO.
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo --redact --verbose --exit-code 1 \
          || echo "::warning::Gitleaks encontrou algo ou não pôde rodar. Verifique o log acima."

  # ===========================================================================
  # Resultado consolidado
  # ===========================================================================
  seguranca-aprovada:
    name: Segurança aprovada
    if: always()
    needs: [dependencias, clippy-seguranca, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verificar o resultado das etapas anteriores
        run: |
          echo "dependências:      ${{ needs.dependencias.result }}"
          echo "clippy segurança:  ${{ needs.clippy-seguranca.result }}"
          echo "codeql:            ${{ needs.codeql.result }}"
          echo ""
          for r in "${{ needs.dependencias.result }}" \
                   "${{ needs.clippy-seguranca.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::Uma conferência de segurança da camada 1 falhou. Veja os detalhes acima."
              exit 1
            fi
          done
          r="${{ needs.codeql.result }}"
          if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
            echo "::error::A análise do CodeQL falhou. Veja os detalhes acima."
            exit 1
          fi
          echo "Todas as conferências de segurança passaram."
