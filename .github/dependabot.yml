# =============================================================================
# Dependabot — atualização automática de dependências
#
# DUAS FONTES DE CÓDIGO DE TERCEIROS
# ----------------------------------
# 1. As bibliotecas Rust (crates) do programa, em Cargo.toml / Cargo.lock.
# 2. A ESTEIRA DE CI. Cada `uses: actions/checkout@v4` no workflow é código
# de terceiros que roda com acesso ao seu repositório. Se uma dessas ações for
# comprometida ou ficar desatualizada, ela vira uma porta de entrada — e é uma
# porta que passa despercebida justamente porque ninguém pensa nela como
# "dependência do projeto".
#
# Este arquivo faz o GitHub avisar quando uma delas tiver atualização.
#
# AS AÇÕES ESTÃO FIXADAS PELO SHA COMPLETO DO COMMIT (com um comentário
# "# vX.Y.Z" ao lado). O Dependabot entende esse formato: ele troca o SHA pelo da
# versão nova e atualiza o comentário. Assim o SHA continua sendo revisado em um
# Pull Request, em vez de a tag "andar" sozinha por baixo da esteira.
# =============================================================================

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    # Um único PR por semana com todas as ações, em vez de um PR por ação.
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - dependencias
      - seguranca

  # O programa é escrito em Rust e usa um punhado de bibliotecas (crates) de terceiros, todas
  # listadas em Cargo.toml e fixadas por versão e hash em Cargo.lock. O Dependabot propõe as
  # atualizações num único PR semanal; o CI (testes, clippy) e o cargo-audit do security.yml
  # decidem se elas podem entrar.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      cargo:
        patterns:
          - '*'
    labels:
      - dependencias
      - seguranca
