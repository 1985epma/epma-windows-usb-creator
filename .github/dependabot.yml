# =============================================================================
# Dependabot — atualização automática de dependências
#
# "MAS O PROJETO NÃO TEM DEPENDÊNCIAS!"
# -------------------------------------
# Correto: o programa em si não usa nenhuma biblioteca de terceiros.
#
# Mas a ESTEIRA DE CI usa. Cada `uses: actions/checkout@v4` no workflow é código
# de terceiros que roda com acesso ao seu repositório. Se uma dessas ações for
# comprometida ou ficar desatualizada, ela vira uma porta de entrada — e é uma
# porta que passa despercebida justamente porque ninguém pensa nela como
# "dependência do projeto".
#
# Este arquivo faz o GitHub avisar quando uma delas tiver atualização.
#
# AS AÇÕES ESTÃO FIXADAS PELO SHA COMPLETO DO COMMIT (com um comentário
# "# vX.Y.Z" ao lado). O Dependabot entende esse formato: ele troca o SHA pelo da
# versão nova e atualiza o comentário. Assim o SHA continua sendo revisado em um
# Pull Request, em vez de a tag "andar" sozinha por baixo da esteira.
# =============================================================================

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    # Um único PR por semana com todas as ações, em vez de um PR por ação.
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - dependencias
      - seguranca

  # Se um dia o projeto passar a ter dependências Python, descomente o bloco
  # abaixo. Antes disso ele não tem o que monitorar.
  #
  # - package-ecosystem: pip
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5
